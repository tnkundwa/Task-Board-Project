apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: task-board/api-gateway:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            # Merges with (and overrides) the packaged application.yml -- the JAR itself is
            # never modified. See base/configmap.yaml (gateway-config) for the actual routes.
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/"
          volumeMounts:
            - name: gateway-config
              mountPath: /config
          startupProbe:
            # Just "is the port open" -- doesn't depend on any downstream service being up yet.
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            # Proxies to team-service, so this correctly reports "not ready" if an upstream is
            # unreachable -- readiness failures don't restart the container, they just pull it
            # out of the Service's endpoints until the upstream recovers.
            httpGet:
              path: /api/teams
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Deliberately does NOT proxy anywhere: liveness must only ask "is this process
            # alive", not "are this process's dependencies alive" -- otherwise a slow/down
            # upstream causes kubelet to restart a perfectly healthy gateway.
            tcpSocket:
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config

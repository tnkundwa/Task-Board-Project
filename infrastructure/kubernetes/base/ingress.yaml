apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Swagger UI / OpenAPI JSON for each backend, proxied through the Gateway (which strips
          # the prefix -- see base/configmap.yaml's gateway-config routes). Must come before the
          # catch-all "/" rule.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /task-service
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /team-service
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /notification-service
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

# Plain-text Secrets for local/dev use only (see CHALLENGE.md constraints -- a real deployment
# would use SOPS or SealedSecrets instead). Values intentionally mirror infrastructure/docker/.env
# for consistency across Compose and Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root_local_dev
  MYSQL_USER: taskboard
  MYSQL_PASSWORD: taskboard_local_dev
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
type: Opaque
stringData:
  RABBITMQ_USERNAME: taskboard
  RABBITMQ_PASSWORD: taskboard_local_dev

# Default-deny for both directions, namespace-wide. Every other policy in this directory is an
# explicit allow layered on top -- anything not explicitly permitted is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: taskboard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

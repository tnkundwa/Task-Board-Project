apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: team-service-policy
  namespace: taskboard
spec:
  podSelector:
    matchLabels:
      app: team-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: task-service
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # database access (also used by the create-db initContainer)
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-service-policy
  namespace: taskboard
spec:
  podSelector:
    matchLabels:
      app: task-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # member validation
    - to:
        - podSelector:
            matchLabels:
              app: team-service
      ports:
        - protocol: TCP
          port: 8082
    # event publishing
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    # database access (also used by the create-db initContainer)
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

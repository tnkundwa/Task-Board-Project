server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: task-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/tasks/**
        - id: team-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/teams/**
        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/notifications/**
